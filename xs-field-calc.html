.rr .k { color: var(--disp-dim); font-size: 13px; flex: 1 1 12ch; min-width: 0; }
.rr .v { font-family: var(--f-mono); font-weight: 500; font-size: 16px; color: var(--disp-fg); text-align: right; overflow-wrap: break-word; min-width: 0; margin-left: auto; max-width: 100%; }
.rr .v i { font-style: normal; color: var(--disp-dim); font-size: 12.5px; margin-left: 4px; }
.rr.big .v { font-size: 22px; color: var(--disp-num); font-weight: 600; }
.rr .a { flex-basis: 100%; text-align: right; font-family: var(--f-mono); font-size: 12px; color: var(--disp-dim); margin-top: -2px; }
.rr.ok .v { color: var(--disp-ok); } .rr.warn .v { color: var(--disp-warn); } .rr.bad .v { color: var(--disp-bad); }
.rh { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); padding: 10px 0 2px; font-weight: 600; }
.rh:first-child { padding-top: 0; }
.wl { display: grid; gap: 6px; }
.w { border-radius: 6px; padding: 8px 10px; font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; }
.w::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.w.ok { background: var(--ok-bg); } .w.ok::before { background: var(--ok); }
.w.warn { background: var(--warn-bg); } .w.warn::before { background: var(--warn); }
.w.bad { background: var(--bad-bg); } .w.bad::before { background: var(--bad); }
.w.info { background: var(--chip); } .w.info::before { background: var(--ink3); }
.disc { font-size: 12px; color: var(--ink3); margin: 0; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.full > *, .fig { min-width: 0; }
.fig { background: var(--fig); border: 1px solid var(--line); border-radius: min(8px, var(--radius)); padding: 8px; overflow-x: auto; }
.fig svg { display: block; width: 100%; height: auto; max-height: 340px; }
.fig .cap { font-size: 12px; color: var(--ink3); padding: 4px 4px 0; }
svg .pp { fill: none; stroke: var(--pipe); stroke-linecap: round; stroke-linejoin: round; }
svg .pc { fill: none; stroke: var(--fig); stroke-width: 1; stroke-dasharray: 4 3; }
svg .gr { stroke: var(--fig-grid); stroke-width: 1; }
svg .mk { stroke: var(--mark); stroke-width: 2.2; }
svg .mt { fill: var(--mark); font: 600 12px var(--f-mono); }
svg .lb { fill: var(--ink2); font: 500 12px var(--f-body); }

svg .t2 { fill: var(--ink2); font: 500 12px var(--f-body); }

ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 4px; font-size: 14px; }

.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: min(8px, var(--radius)); }

.gp { margin: 0; max-width: 75ch; }

.calc { display: grid; gap: 12px; }

.cscreen input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--disp-line); color: var(--disp-fg); font-family: var(--f-mono); font-size: 18px; padding: 6px 0; }
.cres { font-family: var(--f-mono); font-size: 28px; color: var(--disp-num); font-weight: 600; text-align: right; min-height: 40px; overflow-wrap: anywhere; }
.calt { font-family: var(--f-mono); font-size: 13px; color: var(--disp-dim); text-align: right; min-height: 18px; }
.cmem { font-family: var(--f-mono); font-size: 12px; color: var(--disp-dim); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.keys { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.key { border: 1px solid var(--line); background: var(--field); border-radius: 6px; padding: 10px 0; font-family: var(--f-mono); font-size: 16px; cursor: pointer; text-align: center; min-width: 0; }
.key:hover { border-color: var(--ink2); }

.key.u { font-size: 13px; }
.tape { border: 1px solid var(--line); border-radius: min(8px, var(--radius)); max-height: 340px; overflow-y: auto; }
.tape h3 { font-family: var(--f-disp); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; margin: 0; padding: 8px 12px; color: var(--ink2); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); }
.tape ol { list-style: none; margin: 0; padding: 0; }
.tape li { padding: 6px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; cursor: pointer; }
.tape li:hover { background: var(--chip); }
.tape .te { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink2); overflow-wrap: anywhere; }
.tape .tr { font-family: var(--f-mono); font-size: 14.5px; text-align: right; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.panel h2 { font-family: var(--f-disp); font-weight: 700; font-size: 19px; margin: 0; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.entry { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
.entry pre { white-space: pre-wrap; font-family: var(--f-mono); font-size: 12.5px; margin: 0; color: var(--ink2); max-height: 180px; overflow: auto; }
.pill { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--ink2); }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
.foot { border-top: 1px solid var(--line); color: var(--ink3); font-size: 12.5px; }
.foot .wrap { padding-block: 14px 22px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.foot b { color: var(--ink2); font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,0.25); max-width: calc(100% - 32px); }
.pop { display: grid; gap: 8px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px; position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(100% + 6px); width: min(320px, calc(100vw - 32px)); box-shadow: 0 10px 30px rgba(0,0,0,0.25); z-index: 40; }
.pop input { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.copyfb { width: 100%; min-height: 120px; font-family: var(--f-mono); font-size: 12px; background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }

.hctl label span { display: none; }
.keys { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.ins { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
