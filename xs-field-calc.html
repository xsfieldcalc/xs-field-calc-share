let last=0,busy=false;
const check=async()=>{if(busy||!navigator.onLine||!window.crypto||!crypto.subtle)return;busy=true;last=Date.now();try{
const r=await fetch(CH+VF+"?t="+Date.now(),{cache:"no-store"});
try{const sd=Date.parse(r.headers.get("date")||"");if(sd){const sv=+localStorage.getItem("xsfc.seen")||0;if(sd>sv)localStorage.setItem("xsfc.seen",String(sd));}}catch(e){}
const v=await r.json();
if(v.revoked){try{if(localStorage.getItem("xsfc.rev")!=="1"){localStorage.setItem("xsfc.rev","1");location.reload();}}catch(e){location.reload();}return;}
try{if(localStorage.getItem("xsfc.rev")==="1"){localStorage.removeItem("xsfc.rev");location.reload();return;}}catch(e){}
if(!(v.ts>cur.ts))return;
const h=await(await fetch(CH+v.file+"?t="+Date.now(),{cache:"no-store"})).text();
if(await hex(h)!==v.sha256)return;
const m=h.match(/const P=(\{[^;]*\})/);if(!m)return;
const n=JSON.parse(m[1]);if(n.ts!==v.ts||n.id!==v.id)return;
localStorage.setItem(KEY,JSON.stringify(n));cur=n;
if(!touched){sessionStorage.setItem("xsfc.updated","1");location.reload();}else note(1,true);
}catch(e){}finally{busy=false;}};
(async()=>{try{
const t=await run(cur);const s=document.createElement("script");s.textContent=t;document.body.appendChild(s);s.remove();
window.XS_VERSION={id:cur.id,ts:cur.ts};
try{if(sessionStorage.getItem("xsfc.updated")){sessionStorage.removeItem("xsfc.updated");if(!window.XS_NOTES_SHOWN)note(0,false);}}catch(e){}
setTimeout(check,1500);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-last>6*36e5)check();});
try{if("serviceWorker"in navigator&&window.isSecureContext&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
}catch(e){
if(cur!==P){try{localStorage.removeItem(KEY);}catch(_){}location.reload();return;}
document.getElementById("app").textContent=(T[(navigator.language||"").slice(0,2).toLowerCase()]||T.en)[2];}})();
})();</script>
